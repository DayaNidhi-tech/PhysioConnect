# Application
spring.application.name=PhysioConnect
server.port=8080

# HTTP session = server-side session token. 30-minute idle timeout,
# after which the client must re-authenticate.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Physiology?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# App
# Base URL used to build the email verification link. Override via APP_BASE_URL in prod.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# SMTP (override via env vars in prod). Leave blank for local dev:
# email sending is best-effort and failures are logged, not fatal.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay (override via environment variables; never commit real keys)
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=30m
app.jwt.refresh-token-expiration=7d